<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Звіт"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="color-scheme" content="light dark"><meta name="description" content="Накази, кошториси та подорожні листи в одному місці."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><style>#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#c3a6ff 0%,#9b6cf6 45%,#e255a0 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;transition:opacity .45s ease,transform .45s ease}#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}#splash svg{width:84px;height:84px;filter:drop-shadow(0 10px 24px #0003);animation:sp-pop .6s cubic-bezier(.2,.9,.3,1.3) both}#splash h1{margin:0;font-size:40px;font-weight:750;letter-spacing:-.02em;animation:sp-up .6s .12s ease both}#splash p{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font-size:14px;font-weight:500;opacity:.9;animation:sp-up .6s .3s ease both}@keyframes sp-pop{from{opacity:0;transform:scale(.6)}}@keyframes sp-up{from{opacity:0;transform:translateY(10px)}}@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}</style><title>Звіт</title></head>
<body><div id="splash" aria-hidden="true"><svg viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#fff" fill-opacity=".18"/><path d="M160 158h140q58 0 58 53 0 31-30 45 36 12 36 48 0 56-66 56H160v-44h134q23 0 23-17t-23-17H196v-43h92q22 0 22-18t-22-18H160z" fill="#fff"/><circle cx="384" cy="353" r="18" fill="#fff" opacity=".75"/></svg><h1>Звіти</h1><p>З любов’ю для Улянки ❤️</p></div><script>(function(){var e=document.getElementById("splash");try{if(sessionStorage.getItem("zvit-splash")){e.remove();return}sessionStorage.setItem("zvit-splash","1")}catch(_){}var t0=Date.now();function hide(){if(!e.isConnected)return;e.classList.add("out");setTimeout(function(){e.remove()},500)}e.addEventListener("click",hide);window.addEventListener("load",function(){setTimeout(hide,Math.max(0,1600-(Date.now()-t0)))});setTimeout(hide,3500)})();</script>
<div class="app"><header class="appbar" id="appbar"></header><main id="content"></main></div>
<div class="actionbar" id="actionbar"></div>
<nav class="tabbar" aria-label="Розділи"><button data-view="event"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5M9 13h6M9 17h6"/></svg><span>Круглий стіл</span></button><button data-view="fuel"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14M6 17v2M18 17v2M4 13l2-6h12l2 6v4H4zM7.5 14.5h.01M16.5 14.5h.01"/></svg><span>Подорожній</span></button><button data-view="archive"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Звіти</span></button><button data-view="profile"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg><span>Профіль</span></button></nav>
