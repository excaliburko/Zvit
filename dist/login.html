<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Звіт"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="color-scheme" content="light dark"><title>Вхід · Звіт</title><link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/login.css"></head>
<body><main class="login"><section class="hero"><svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#fff" fill-opacity=".18"/><path d="M160 158h140q58 0 58 53 0 31-30 45 36 12 36 48 0 56-66 56H160v-44h134q23 0 23-17t-23-17H196v-43h92q22 0 22-18t-22-18H160z" fill="#fff"/><circle cx="384" cy="353" r="18" fill="#fff" opacity=".75"/></svg><h1>Звіти</h1><p>Накази, кошториси й подорожні листи в одному місці.</p></section><section class="panel"><h2>Вхід</h2><form id="login-form" method="post" action="/api/login"><label>Логін<input id="username" name="username" autocomplete="username" required maxlength="180" autocapitalize="none" spellcheck="false" placeholder="Ваш логін"></label><label>Пароль<span class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="Введіть пароль"><button id="toggle-password" type="button" aria-label="Показати пароль" aria-pressed="false">Показати</button></span></label><p id="login-error" role="alert" hidden></p><button class="submit" type="submit" id="submit-login">Увійти <span aria-hidden="true">→</span></button></form><p class="help">Потрібен доступ або забули пароль? Зверніться до адміністратора.</p><p class="connection" id="connection-status">Для входу потрібне підключення до інтернету.</p></section></main><script src="/login.js" defer></script></body></html>
